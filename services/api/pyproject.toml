[project]
name = "contraict-api"
version = "0.1.0"
description = "TheContrAIct API: contract analysis, deadlines and alerts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "holidays>=0.106",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "python-dateutil>=2.9.0.post0",
    "redis>=8.1.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-python-dateutil>=2.9.0.20260807",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
check_untyped_defs = true
